[project]
name = "deep_research_agents"
version = "0.1.0"
description = "Deployable deep research agent backend (LangGraph + FastAPI, OpenRouter-only)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain_community>=0.4",
    "langchain_tavily>=0.2.12",
    "langchain_mcp_adapters>=0.1.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.30.0",
    "rich>=14.0.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
setup = ["google-auth-oauthlib>=1.2.0"]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deep_research_agents"]

[tool.setuptools.package-dir]
"deep_research_agents" = "src/deep_research_agents"
